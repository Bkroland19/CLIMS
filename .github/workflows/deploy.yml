name: Deploy published release

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag to deploy (for example v2.0.1)
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy production server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify published release and download image references
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease > release-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("release-metadata.json").read_text())
          if metadata["isDraft"] or metadata["isPrerelease"]:
              raise SystemExit("Only published stable releases may deploy to production")
          PY
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern images.env --pattern images.json --dir release
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG"
          echo "DEPLOY_REF=$(git rev-parse FETCH_HEAD^{commit})" >> "$GITHUB_ENV"
      - name: Verify release source revision
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("release/images.json").read_text())
          if manifest["revision"] != os.environ["DEPLOY_REF"]:
              raise SystemExit("Release manifest does not match the tagged source commit")
          PY
      - name: Transfer release and deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH || '/opt/clims' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: bash scripts/deploy_ssh.sh
