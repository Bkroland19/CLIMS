# Serves the documentation site image. The gateway forwards /handbook/ here unchanged.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Redirects stay relative so they keep the public host instead of this container's.
    absolute_redirect off;

    location = /_nginx/health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location /handbook/ {
        try_files $uri $uri/ =404;
        error_page 404 /handbook/404.html;
    }

    # Docusaurus fingerprints bundled assets, so they never change under the same name.
    location /handbook/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
