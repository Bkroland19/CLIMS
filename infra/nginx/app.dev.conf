resolver 127.0.0.11 valid=10s ipv6=off;
upstream clims_backend { zone clims_backend 64k; server backend:8080 resolve; }
upstream clims_frontend { zone clims_frontend 64k; server frontend:3000 resolve; }
upstream clims_mobile { zone clims_mobile 64k; server mobile:8081 resolve; }
upstream clims_docs { zone clims_docs 64k; server docs:3000 resolve; }

# Preserve paths: Go routes include /api/v1, /docs, and /health.
server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /_nginx/health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /api { proxy_pass http://clims_backend; }
    location /api/ { proxy_pass http://clims_backend; }
    location = /docs { proxy_pass http://clims_backend; }
    location /docs/ { proxy_pass http://clims_backend; }
    location = /health { proxy_pass http://clims_backend; }
    location /health/ { proxy_pass http://clims_backend; }
    # The documentation site (docs/ with Docusaurus); /docs/ stays the API's Swagger UI.
    location = /handbook {
        absolute_redirect off;
        return 301 /handbook/;
    }
    location /handbook/ { proxy_pass http://clims_docs; }
    # The Docusaurus dev server's live-reload socket. Next.js uses /_next/webpack-hmr instead.
    location = /ws {
        proxy_pass http://clims_docs;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://clims_frontend;
        # A location that sets any proxy_set_header inherits none from the server block, so repeat
        # them. X-Real-IP must be nginx's: the web app forwards /api, /docs and /health to the API,
        # which trusts X-Real-IP from inside the container network.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Metro keeps its root paths and WebSocket URLs on a separate proxied port.
server {
    listen 8081;
    server_name _;

    location / {
        proxy_pass http://clims_mobile;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
