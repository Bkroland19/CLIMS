# Separate project name keeps production resources isolated from development.
name: clims-prod

services:
  postgres:
    image: clims-postgres:prod
    build:
      context: ../..
      dockerfile: infra/docker/postgres/Dockerfile.prod

  seaweedfs:
    image: clims-seaweedfs:prod
    build:
      context: ../..
      dockerfile: infra/docker/seaweedfs/Dockerfile.prod

  backend:
    image: ${BACKEND_IMAGE:-clims-backend:prod}
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile.prod
      args:
        VERSION: ${VERSION:-}
        COMMIT_HASH: ${COMMIT_HASH:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}

  frontend:
    image: ${FRONTEND_IMAGE:-clims-frontend:prod}
    build:
      context: ../../frontend
      dockerfile: ../infra/docker/frontend/Dockerfile.prod
      args:
        VERSION: ${VERSION:-}
        # Compiled into the public bundle at build time; never a secret.
        NEXT_PUBLIC_MAP_TILES: ${NEXT_PUBLIC_MAP_TILES:-}
        NEXT_PUBLIC_MAP_ATTRIBUTION: ${NEXT_PUBLIC_MAP_ATTRIBUTION:-}

  # Production only: development previews the site with make docs-serve.
  docs:
    image: ${DOCS_IMAGE:-clims-docs:prod}
    build:
      context: ../..
      dockerfile: infra/docker/docs/Dockerfile.prod
      args:
        VERSION: ${VERSION:-}
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-}
    expose: ["80"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/_nginx/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: clims-nginx:prod
    build:
      context: ../..
      dockerfile: infra/docker/nginx/Dockerfile.prod
    depends_on:
      docs:
        condition: service_healthy

  mobile:
    profiles: ["artifacts"]
    image: ${MOBILE_IMAGE:-clims-mobile:prod}
    build:
      context: ../../mobile
      dockerfile: ../infra/docker/mobile/Dockerfile.prod
      args:
        VERSION: ${VERSION:-}
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-}
    volumes:
      - ../../artifacts/mobile:/artifacts
    restart: "no"
