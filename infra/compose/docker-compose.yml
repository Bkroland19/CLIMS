# Shared definitions. Always combine with exactly one environment override.
name: clims

services:
  postgres:
    environment:
      POSTGRES_DB: ${DB_NAME:-clims_db}
      POSTGRES_USER: ${DB_USER:-clims_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the selected environment file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage: S3-compatible API on port 8333 for documents and uploads.
  seaweedfs:
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in the selected environment file}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in the selected environment file}
    # Writes the single admin identity at startup so credentials stay in the env file.
    entrypoint:
      - sh
      - -c
      - >-
        printf '{"identities":[{"name":"clims","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    expose: ["8333"]
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-clims_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the selected environment file}
      DB_NAME: ${DB_NAME:-clims_db}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the selected environment file}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PUBLIC_ORIGIN: ${OIDC_PUBLIC_ORIGIN:-}
      IDENTITY_SYNC_CLIENT_ID: ${IDENTITY_SYNC_CLIENT_ID:-}
      APP_ENV: ${APP_ENV:-production}
      # Addresses allowed to report the client IP; empty trusts the private container network.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      PORT: 8080
    expose: ["8080"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  frontend:
    expose: ["3000"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  nginx:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/_nginx/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  seaweedfs_data:
